<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Splitter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0" rel="stylesheet">
<style>
  :root{
    --bg:#0f1115;
    --panel:#171a21;
    --panel-2:#1e222b;
    --line:#2a2f3a;
    --line-soft:#232732;
    --text:#e7e9ee;
    --text-dim:#9aa1af;
    --text-faint:#6b7182;
    --accent:#4fd1a5;
    --accent-dim:#2f5d4c;
    --danger:#e2685f;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding:28px 16px 60px;
  }
  .msy{font-family:'Material Symbols Outlined';font-size:20px;line-height:1;vertical-align:middle;}
  .wrap{max-width:560px;margin:0 auto;}
  header{margin-bottom:24px;}
  h1{
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:26px;
    margin:0 0 6px;
    letter-spacing:-0.01em;
  }
  header p{
    margin:0;
    color:var(--text-dim);
    font-size:14px;
    line-height:1.55;
    max-width:46ch;
  }
  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:18px;
    margin-bottom:14px;
  }
  .drop{
    border:1.5px dashed var(--line);
    border-radius:var(--radius);
    padding:28px 16px;
    text-align:center;
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease;
  }
  .drop:hover, .drop:focus-visible{
    border-color:var(--accent);
    background:rgba(79,209,165,0.05);
    outline:none;
  }
  .drop .msy{font-size:30px;color:var(--text-faint);display:block;margin:0 auto 10px;}
  .drop-title{font-size:14px;font-weight:500;color:var(--text);}
  .drop-sub{font-size:12.5px;color:var(--text-faint);margin-top:4px;}
  input[type="file"]{display:none;}

  .file-row{
    display:flex;align-items:center;gap:12px;
  }
  .file-icon{
    width:40px;height:40px;border-radius:8px;
    background:var(--panel-2);border:1px solid var(--line-soft);
    display:flex;align-items:center;justify-content:center;
    color:var(--accent);flex-shrink:0;
  }
  .file-meta{min-width:0;flex:1;}
  .file-name{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .file-sub{font-size:12.5px;color:var(--text-dim);margin-top:2px;font-family:'JetBrains Mono',monospace;}
  .file-clear{
    background:none;border:none;color:var(--text-faint);cursor:pointer;
    padding:6px;border-radius:6px;display:flex;
  }
  .file-clear:hover{color:var(--danger);background:rgba(226,104,95,0.1);}

  .section-label{
    font-size:12px;color:var(--text-faint);margin:0 0 10px;
    text-transform:none;
  }
  .seg{
    display:flex;background:var(--panel-2);border:1px solid var(--line-soft);
    border-radius:8px;padding:3px;gap:3px;
  }
  .seg button{
    flex:1;background:none;border:none;color:var(--text-dim);
    font-family:'Inter',sans-serif;font-size:13.5px;font-weight:500;
    padding:8px 10px;border-radius:6px;cursor:pointer;
    transition:background .15s ease, color .15s ease;
  }
  .seg button.active{background:var(--panel);color:var(--text);}

  .mode-panel{margin-top:16px;}
  .field-row{display:flex;align-items:center;gap:10px;}
  .num-input{
    width:70px;background:var(--panel-2);border:1px solid var(--line-soft);
    color:var(--text);border-radius:7px;padding:9px 10px;font-size:14px;
    font-family:'JetBrains Mono',monospace;text-align:center;
  }
  .num-input:focus{outline:none;border-color:var(--accent);}
  .field-hint{font-size:13px;color:var(--text-dim);}

  .parts-preview{margin-top:14px;display:flex;flex-direction:column;gap:6px;}
  .part-chip{
    display:flex;justify-content:space-between;align-items:center;
    background:var(--panel-2);border:1px solid var(--line-soft);
    border-radius:7px;padding:8px 12px;font-size:13px;
  }
  .part-chip .idx{color:var(--text-faint);width:20px;}
  .part-chip .range{font-family:'JetBrains Mono',monospace;color:var(--text-dim);}

  .range-row{
    display:flex;align-items:center;gap:8px;margin-bottom:8px;
  }
  .time-input{
    background:var(--panel-2);border:1px solid var(--line-soft);
    color:var(--text);border-radius:7px;padding:9px 10px;
    font-family:'JetBrains Mono',monospace;font-size:13.5px;width:100px;
    text-align:center;
  }
  .time-input:focus{outline:none;border-color:var(--accent);}
  .time-input.invalid{border-color:var(--danger);}
  .arrow-sep{color:var(--text-faint);font-size:14px;}
  .remove-row{
    background:none;border:none;color:var(--text-faint);cursor:pointer;
    padding:6px;border-radius:6px;margin-left:auto;display:flex;
  }
  .remove-row:hover{color:var(--danger);}
  .add-range{
    display:flex;align-items:center;gap:6px;background:none;border:1px dashed var(--line);
    color:var(--text-dim);font-size:13px;padding:8px 12px;border-radius:7px;
    cursor:pointer;margin-top:4px;width:100%;justify-content:center;
    font-family:'Inter',sans-serif;
  }
  .add-range:hover{border-color:var(--accent);color:var(--accent);}

  .error-text{color:var(--danger);font-size:12.5px;margin-top:8px;}

  .export-btn{
    width:100%;background:var(--accent);color:#0b1310;border:none;
    font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:15px;
    padding:14px;border-radius:var(--radius);cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:8px;
    transition:filter .15s ease;
  }
  .export-btn:hover:not(:disabled){filter:brightness(1.08);}
  .export-btn:disabled{background:var(--panel-2);color:var(--text-faint);cursor:not-allowed;}

  .status-line{
    font-size:12.5px;color:var(--text-faint);text-align:center;margin-top:10px;
    min-height:16px;
  }

  .progress-track{
    height:6px;background:var(--panel-2);border-radius:4px;overflow:hidden;margin-top:14px;
  }
  .progress-fill{
    height:100%;background:var(--accent);width:0%;
    transition:width .25s ease;
  }
  .progress-count{
    font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--text-dim);
    text-align:right;margin-top:6px;
  }

  .results{display:flex;flex-direction:column;gap:8px;margin-top:4px;}
  .result-row{
    display:flex;align-items:center;gap:10px;
    background:var(--panel-2);border:1px solid var(--line-soft);
    border-radius:8px;padding:10px 12px;
  }
  .result-icon{color:var(--accent);flex-shrink:0;display:flex;}
  .result-meta{flex:1;min-width:0;}
  .result-name{font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .result-size{font-size:12px;color:var(--text-faint);font-family:'JetBrains Mono',monospace;}
  .dl-btn{
    background:none;border:1px solid var(--line);color:var(--text);
    border-radius:6px;padding:7px 12px;font-size:12.5px;cursor:pointer;
    display:flex;align-items:center;gap:5px;text-decoration:none;flex-shrink:0;
  }
  .dl-btn:hover{border-color:var(--accent);color:var(--accent);}

  .hidden{display:none !important;}

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Video Splitter</h1>
    <p>ভিডিও পিক করো, রেঞ্জ দাও, এক্সপোর্ট চাপো — মূল কোয়ালিটি ও ফরম্যাট অপরিবর্তিত থাকবে, কোনো রি-এনকোড হবে না।</p>
  </header>

  <div class="card">
    <div id="dropZone" class="drop" tabindex="0" role="button" aria-label="ভিডিও ফাইল নির্বাচন করুন">
      <span class="msy" aria-hidden="true">upload_file</span>
      <div class="drop-title">ভিডিও ফাইল সিলেক্ট করো</div>
      <div class="drop-sub">MP4, MOV, MKV সমর্থিত</div>
    </div>
    <input type="file" id="fileInput" accept="video/*">

    <div id="fileInfo" class="file-row hidden">
      <div class="file-icon"><span class="msy" aria-hidden="true">movie</span></div>
      <div class="file-meta">
        <div class="file-name" id="fileName"></div>
        <div class="file-sub" id="fileSub"></div>
      </div>
      <button class="file-clear" id="clearFile" aria-label="ফাইল মুছুন"><span class="msy" aria-hidden="true">close</span></button>
    </div>
  </div>

  <div id="splitCard" class="card hidden">
    <p class="section-label">স্প্লিট মোড</p>
    <div class="seg">
      <button id="modeEqualBtn" class="active">সমান পার্ট</button>
      <button id="modeManualBtn">নিজে সময় দাও</button>
    </div>

    <div id="equalPanel" class="mode-panel">
      <div class="field-row">
        <input type="number" id="partsCount" class="num-input" min="2" max="20" value="3">
        <span class="field-hint">টি সমান পার্টে ভাগ হবে</span>
      </div>
      <div id="partsPreview" class="parts-preview"></div>
    </div>

    <div id="manualPanel" class="mode-panel hidden">
      <div id="rangeRows"></div>
      <button class="add-range" id="addRangeBtn">
        <span class="msy" aria-hidden="true">add</span> আরেকটা রেঞ্জ যোগ করো
      </button>
    </div>

    <div id="errorText" class="error-text hidden"></div>
  </div>

  <div id="exportCard" class="card hidden">
    <button class="export-btn" id="exportBtn">
      <span class="msy" aria-hidden="true">content_cut</span> এক্সপোর্ট করো
    </button>
    <div class="status-line" id="statusLine"></div>
    <div id="progressWrap" class="hidden">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-count" id="progressCount"></div>
    </div>
  </div>

  <div id="resultsCard" class="card hidden">
    <p class="section-label">রেডি হয়ে গেছে</p>
    <div class="results" id="resultsList"></div>
  </div>

</div>

<video id="hiddenVideo" class="hidden"></video>

<script type="module">
(async function(){
  "use strict";

  var FFmpegLibs = await import('https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/esm/index.js');
  var FFmpegUtil = await import('https://unpkg.com/@ffmpeg/util@0.12.1/dist/esm/index.js');
  var FFmpeg = FFmpegLibs.FFmpeg;
  var fetchFile = FFmpegUtil.fetchFile;
  var toBlobURL = FFmpegUtil.toBlobURL;

  var state = {
    file: null,
    duration: 0,
    mode: "equal",
    partsCount: 3,
    ranges: [],
    ffmpeg: null,
    ffmpegLoaded: false
  };

  var dropZone = document.getElementById('dropZone');
  var fileInput = document.getElementById('fileInput');
  var fileInfo = document.getElementById('fileInfo');
  var fileName = document.getElementById('fileName');
  var fileSub = document.getElementById('fileSub');
  var clearFile = document.getElementById('clearFile');
  var splitCard = document.getElementById('splitCard');
  var modeEqualBtn = document.getElementById('modeEqualBtn');
  var modeManualBtn = document.getElementById('modeManualBtn');
  var equalPanel = document.getElementById('equalPanel');
  var manualPanel = document.getElementById('manualPanel');
  var partsCountInput = document.getElementById('partsCount');
  var partsPreview = document.getElementById('partsPreview');
  var rangeRows = document.getElementById('rangeRows');
  var addRangeBtn = document.getElementById('addRangeBtn');
  var errorText = document.getElementById('errorText');
  var exportCard = document.getElementById('exportCard');
  var exportBtn = document.getElementById('exportBtn');
  var statusLine = document.getElementById('statusLine');
  var progressWrap = document.getElementById('progressWrap');
  var progressFill = document.getElementById('progressFill');
  var progressCount = document.getElementById('progressCount');
  var resultsCard = document.getElementById('resultsCard');
  var resultsList = document.getElementById('resultsList');
  var hiddenVideo = document.getElementById('hiddenVideo');

  function secToHHMMSS(sec){
    sec = Math.max(0, Math.round(sec));
    var h = Math.floor(sec/3600);
    var m = Math.floor((sec%3600)/60);
    var s = sec%60;
    function pad(n){ return n<10 ? "0"+n : ""+n; }
    return pad(h)+":"+pad(m)+":"+pad(s);
  }

  function hhmmssToSec(str){
    var parts = String(str).trim().split(":");
    if(parts.length !== 3) return null;
    var h = parseInt(parts[0],10), m = parseInt(parts[1],10), s = parseInt(parts[2],10);
    if(isNaN(h)||isNaN(m)||isNaN(s)) return null;
    if(m>59 || s>59 || h<0 || m<0 || s<0) return null;
    return h*3600+m*60+s;
  }

  function formatBytes(bytes){
    if(bytes < 1024*1024) return (bytes/1024).toFixed(0)+" KB";
    return (bytes/(1024*1024)).toFixed(1)+" MB";
  }

  function showError(msg){
    if(!msg){ errorText.classList.add('hidden'); errorText.textContent=""; return; }
    errorText.textContent = msg;
    errorText.classList.remove('hidden');
  }

  // --- File selection ---
  dropZone.addEventListener('click', function(){ fileInput.click(); });
  dropZone.addEventListener('keydown', function(e){
    if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); fileInput.click(); }
  });
  fileInput.addEventListener('change', function(e){
    var f = e.target.files[0];
    if(f) handleFile(f);
  });

  function handleFile(f){
    state.file = f;
    var url = URL.createObjectURL(f);
    hiddenVideo.src = url;
    hiddenVideo.onloadedmetadata = function(){
      state.duration = hiddenVideo.duration;
      fileName.textContent = f.name;
      fileSub.textContent = secToHHMMSS(state.duration) + "  ·  " + formatBytes(f.size);
      dropZone.classList.add('hidden');
      fileInfo.classList.remove('hidden');
      splitCard.classList.remove('hidden');
      exportCard.classList.remove('hidden');
      resultsCard.classList.add('hidden');
      resultsList.innerHTML = "";
      if(state.ranges.length === 0){
        addRange();
      }
      renderEqualPreview();
      renderManualRows();
    };
  }

  clearFile.addEventListener('click', function(){
    state.file = null;
    state.duration = 0;
    fileInput.value = "";
    dropZone.classList.remove('hidden');
    fileInfo.classList.add('hidden');
    splitCard.classList.add('hidden');
    exportCard.classList.add('hidden');
    resultsCard.classList.add('hidden');
  });

  // --- Mode toggle ---
  modeEqualBtn.addEventListener('click', function(){
    state.mode = "equal";
    modeEqualBtn.classList.add('active');
    modeManualBtn.classList.remove('active');
    equalPanel.classList.remove('hidden');
    manualPanel.classList.add('hidden');
    showError(null);
  });
  modeManualBtn.addEventListener('click', function(){
    state.mode = "manual";
    modeManualBtn.classList.add('active');
    modeEqualBtn.classList.remove('active');
    manualPanel.classList.remove('hidden');
    equalPanel.classList.add('hidden');
    showError(null);
  });

  // --- Equal parts ---
  partsCountInput.addEventListener('input', function(){
    var v = parseInt(partsCountInput.value,10);
    if(isNaN(v) || v<2) v=2;
    if(v>20) v=20;
    state.partsCount = v;
    renderEqualPreview();
  });

  function getEqualRanges(){
    var n = state.partsCount;
    var dur = state.duration;
    var chunk = dur/n;
    var out = [];
    for(var i=0;i<n;i++){
      var start = i*chunk;
      var end = (i===n-1) ? dur : (i+1)*chunk;
      out.push({start:start, end:end});
    }
    return out;
  }

  function renderEqualPreview(){
    if(!state.duration) return;
    var ranges = getEqualRanges();
    partsPreview.innerHTML = "";
    ranges.forEach(function(r, i){
      var chip = document.createElement('div');
      chip.className = "part-chip";
      chip.innerHTML = '<span class="idx">'+(i+1)+'</span><span class="range">'+secToHHMMSS(r.start)+' \u2192 '+secToHHMMSS(r.end)+'</span>';
      partsPreview.appendChild(chip);
    });
  }

  // --- Manual ranges ---
  function addRange(){
    var lastEnd = state.ranges.length ? state.ranges[state.ranges.length-1].endSec : 0;
    state.ranges.push({
      startStr: secToHHMMSS(lastEnd),
      endStr: secToHHMMSS(Math.min(state.duration, lastEnd + 60)),
      startSec: lastEnd,
      endSec: Math.min(state.duration, lastEnd+60)
    });
    renderManualRows();
  }

  addRangeBtn.addEventListener('click', addRange);

  function renderManualRows(){
    rangeRows.innerHTML = "";
    state.ranges.forEach(function(r, i){
      var row = document.createElement('div');
      row.className = "range-row";

      var startInput = document.createElement('input');
      startInput.type = "text";
      startInput.className = "time-input";
      startInput.value = r.startStr;
      startInput.placeholder = "00:00:00";
      startInput.addEventListener('change', function(){
        r.startStr = startInput.value;
        validateRanges();
      });

      var sep = document.createElement('span');
      sep.className = "arrow-sep";
      sep.textContent = "\u2192";

      var endInput = document.createElement('input');
      endInput.type = "text";
      endInput.className = "time-input";
      endInput.value = r.endStr;
      endInput.placeholder = "00:00:00";
      endInput.addEventListener('change', function(){
        r.endStr = endInput.value;
        validateRanges();
      });

      var removeBtn = document.createElement('button');
      removeBtn.className = "remove-row";
      removeBtn.innerHTML = '<span class="msy" aria-hidden="true">delete</span>';
      removeBtn.setAttribute('aria-label','রেঞ্জ মুছুন');
      removeBtn.addEventListener('click', function(){
        state.ranges.splice(i,1);
        renderManualRows();
      });

      row.appendChild(startInput);
      row.appendChild(sep);
      row.appendChild(endInput);
      row.appendChild(removeBtn);
      rangeRows.appendChild(row);
    });
  }

  function validateRanges(){
    showError(null);
    for(var i=0;i<state.ranges.length;i++){
      var r = state.ranges[i];
      var s = hhmmssToSec(r.startStr);
      var e = hhmmssToSec(r.endStr);
      if(s===null || e===null){
        showError("hh:mm:ss ফরম্যাটে সময় দাও (যেমন 00:01:30)");
        return false;
      }
      if(s>=e){
        showError((i+1)+" নম্বর রেঞ্জে শুরু সময় শেষ সময়ের চেয়ে কম হতে হবে");
        return false;
      }
      if(e>state.duration+1){
        showError((i+1)+" নম্বর রেঞ্জ ভিডিওর দৈর্ঘ্যের বেশি");
        return false;
      }
      r.startSec = s; r.endSec = e;
    }
    return true;
  }

  // --- Export ---
  function getFinalRanges(){
    if(state.mode === "equal"){
      return getEqualRanges();
    } else {
      if(!validateRanges()) return null;
      return state.ranges.map(function(r){ return {start:r.startSec, end:r.endSec}; });
    }
  }

  exportBtn.addEventListener('click', async function(){
    var ranges = getFinalRanges();
    if(!ranges) return;
    if(!state.file){ showError("আগে একটা ভিডিও ফাইল সিলেক্ট করো"); return; }

    exportBtn.disabled = true;
    resultsCard.classList.add('hidden');
    resultsList.innerHTML = "";
    progressWrap.classList.remove('hidden');
    progressFill.style.width = "0%";
    progressCount.textContent = "";

    try {
      if(!state.ffmpegLoaded){
        statusLine.textContent = "প্রথমবার প্রসেসিং ইঞ্জিন লোড হচ্ছে (একটু সময় লাগবে)...";
        state.ffmpeg = new FFmpeg();
        var coreBaseURL = "https://unpkg.com/@ffmpeg/core@0.12.6/dist/esm";
        var ffmpegBaseURL = "https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/esm";
        await state.ffmpeg.load({
          coreURL: await toBlobURL(coreBaseURL + "/ffmpeg-core.js", "text/javascript"),
          wasmURL: await toBlobURL(coreBaseURL + "/ffmpeg-core.wasm", "application/wasm"),
          classWorkerURL: await toBlobURL(ffmpegBaseURL + "/worker.js", "text/javascript")
        });
        state.ffmpegLoaded = true;
      }

      statusLine.textContent = "ভিডিও ফাইল প্রসেসিং ইঞ্জিনে লোড হচ্ছে...";
      var inputName = "input" + (state.file.name.match(/\.[^.]+$/) ? state.file.name.match(/\.[^.]+$/)[0] : ".mp4");
      var data = await fetchFile(state.file);
      await state.ffmpeg.writeFile(inputName, data);

      var baseName = state.file.name.replace(/\.[^.]+$/, "");
      var ext = (state.file.name.match(/\.[^.]+$/) || [".mp4"])[0];
      var results = [];

      for(var i=0;i<ranges.length;i++){
        var r = ranges[i];
        var dur = r.end - r.start;
        var outName = "part"+(i+1)+ext;
        statusLine.textContent = "পার্ট "+(i+1)+"/"+ranges.length+" কাটা হচ্ছে...";
        progressCount.textContent = i+"/"+ranges.length+" সম্পন্ন";

        await state.ffmpeg.exec([
          '-ss', String(r.start),
          '-i', inputName,
          '-t', String(dur),
          '-c', 'copy',
          '-avoid_negative_ts', 'make_zero',
          outName
        ]);

        var outData = await state.ffmpeg.readFile(outName);
        var blob = new Blob([outData], {type:'video/mp4'});
        var outFileName = baseName + "_part" + (i+1) + ext;
        results.push({name: outFileName, size: blob.size, url: URL.createObjectURL(blob)});
        await state.ffmpeg.deleteFile(outName);

        progressFill.style.width = Math.round(((i+1)/ranges.length)*100)+"%";
        progressCount.textContent = (i+1)+"/"+ranges.length+" সম্পন্ন";
      }

      statusLine.textContent = "সব পার্ট রেডি — নিচে থেকে ডাউনলোড করো";
      renderResults(results);

    } catch(err){
      showError("এক্সপোর্ট করতে সমস্যা হয়েছে: " + (err && err.message ? err.message : String(err)));
      statusLine.textContent = "";
    } finally {
      exportBtn.disabled = false;
    }
  });

  function renderResults(results){
    resultsCard.classList.remove('hidden');
    resultsList.innerHTML = "";
    results.forEach(function(res){
      var row = document.createElement('div');
      row.className = "result-row";
      row.innerHTML =
        '<div class="result-icon"><span class="msy" aria-hidden="true">movie</span></div>'+
        '<div class="result-meta">'+
          '<div class="result-name">'+res.name+'</div>'+
          '<div class="result-size">'+formatBytes(res.size)+'</div>'+
        '</div>';
      var dl = document.createElement('a');
      dl.className = "dl-btn";
      dl.href = res.url;
      dl.download = res.name;
      dl.innerHTML = '<span class="msy" aria-hidden="true">download</span> সেভ';
      row.appendChild(dl);
      resultsList.appendChild(row);
    });
  }

})();
</script>
</body>
</html>
